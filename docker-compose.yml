services:
  gestor-notas:
    build: .
    image: gestor-notas:2.0
    container_name: gestor-notas
    ports:
      - "5000:5000"
    environment:
      GESTOR_DB_PATH: /app/datos/gestor_notas.db
    volumes:
      - ./datos:/app/datos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped